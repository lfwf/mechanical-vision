name: Mechanical quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        id: install
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee install.log

      - name: Validate quality records, mechanics and build
        id: verify
        if: steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-logs
          path: |
            install.log
            verify.log
          if-no-files-found: warn
          retention-days: 7

      - name: Report verification failure
        if: github.event_name == 'pull_request' && (steps.install.outcome == 'failure' || steps.verify.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const readTail = (file) => {
              if (!fs.existsSync(file)) return `${file} was not created`;
              const text = fs.readFileSync(file, 'utf8');
              return text.slice(-12000);
            };
            const body = [
              '## CI verification failed',
              '',
              '```text',
              readTail('verify.log'),
              '```',
              '',
              '<details><summary>Dependency installation tail</summary>',
              '',
              '```text',
              readTail('install.log'),
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail when install or verification failed
        if: steps.install.outcome == 'failure' || steps.verify.outcome == 'failure'
        run: exit 1
